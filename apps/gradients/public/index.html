<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FORKBOMB Gradients — every gradient, live</title>
<meta name="description" content="556 MIT-licensed gradients plus mesh, aurora, grain and dot effects with copy-ready CSS and GLSL."><meta name="theme-color" content="#07070c"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>FORKBOMB <b>Gradients</b></h1>
<nav id="tabs" aria-label="Gradient modes"><button data-tab="css" class="on">CSS</button><button data-tab="mesh">Mesh</button><button data-tab="aurora">Aurora</button><button data-tab="dots">Dots</button></nav>
<span id="count" aria-live="polite">556 gradients · uiGradients + WebGradients (MIT)</span></header>
<main>
  <section id="stage"><div id="cssPreview"></div><canvas id="gl" role="img" aria-label="Gradient preview"></canvas><canvas id="dots" role="img" aria-label="Dot effect preview"></canvas><div id="grainLayer"></div></section>
  <aside id="controls" aria-label="Controls"></aside>
</main>
<section id="lib" aria-label="Gradient library"><label for="q" class="sr">Search gradients</label><input id="q" type="search" placeholder="search 556 gradients…"><div id="grid"></div></section>
<footer>Gradient data: <a href="https://github.com/ghosh/uiGradients">uiGradients</a> (MIT) + <a href="https://github.com/itmeo/webgradients">WebGradients</a> (MIT). Mesh/aurora/grain/dots: original FORKBOMB code (MIT); dot effects are clean-room, inspired by <a href="https://dotsui.dev">dotsui.dev</a>.</footer>
<pre id="out"></pre>
<script defer src="include.js"></script><script defer src="core.js"></script><script defer src="app.js"></script>
</body></html>
