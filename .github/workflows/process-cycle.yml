name: process-cycle

on:
  push:
    paths:
      - "pieces/**"
      - "packs/**"
      - "connectors/**"
      - "toolkit/process/**"
      - "toolkit/scanner/**"
      - "apps/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "pieces/**"
      - "packs/**"
      - "connectors/**"
      - "toolkit/process/**"
      - "toolkit/scanner/**"
      - "apps/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate the system on itself
        run: node toolkit/process/cycle.js validate
      - name: Print the cycle checklist
        run: node toolkit/process/cycle.js checklist >> "$GITHUB_STEP_SUMMARY"
      - name: Scanner offline tests
        run: node toolkit/scanner/test.js
      - name: Validator (cycle.js) tests
        run: node toolkit/process/test.js
